name: Sawt
options:
  bundleIdPrefix: com.za7ef
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: ar
packages:
  MLXSwiftLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    exactVersion: 3.32.3
  MLXSwift:
    url: https://github.com/ml-explore/mlx-swift
    minorVersion: 0.32.3
  SwiftHuggingFace:
    url: https://github.com/huggingface/swift-huggingface
    from: 0.9.0
  SwiftTransformers:
    url: https://github.com/huggingface/swift-transformers
    from: 1.3.0
  ArgmaxOSS:
    url: https://github.com/argmaxinc/argmax-oss-swift
    exactVersion: 1.1.1
  SherpaOnnx:
    url: https://github.com/k2-fsa/sherpa-onnx
    exactVersion: 1.13.8
targets:
  Sawt:
    type: application
    platform: iOS
    sources:
      - path: Sawt
        excludes:
          - Resources/Voices
      - path: Sawt/Resources/Voices
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.za7ef.sawt
        PRODUCT_NAME: Sawt
        MARKETING_VERSION: "0.5.0"
        CURRENT_PROJECT_VERSION: "10"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Sawt/Info.plist
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        ENABLE_BITCODE: "NO"
        OTHER_LDFLAGS: ["-lc++"]
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: MLXSwift
        product: MLX
      - package: MLXSwift
        product: MLXNN
      - package: MLXSwift
        product: MLXFFT
      - package: MLXSwift
        product: MLXRandom
      - package: MLXSwiftLM
        product: MLXLLM
      - package: MLXSwiftLM
        product: MLXVLM
      - package: MLXSwiftLM
        product: MLXLMCommon
      - package: MLXSwiftLM
        product: MLXHuggingFace
      - package: SwiftHuggingFace
        product: HuggingFace
      - package: SwiftTransformers
        product: Tokenizers
      - package: ArgmaxOSS
        product: WhisperKit
      - package: SherpaOnnx
        product: sherpa-onnx
schemes:
  Sawt:
    build:
      targets:
        Sawt: all
    archive:
      config: Release
