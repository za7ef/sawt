[package]
name = "sawtctl"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
# idevice (MIT, jkcoxson): بروتوكولات خدمات المطوّر في iOS
idevice = { git = "https://github.com/jkcoxson/idevice", rev = "89702099f4d7552f704f93b4526756abda319ceb", default-features = false, features = [
  "ring", "tcp", "core_device_proxy", "tunnel_tcp_stack", "rsd", "xpc", "core_device", "display_stream", "dvt", "remote_pairing", "cryptexd", "mobile_image_mounter", "tss",
] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "macros", "io-util", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
plist = "1"
uuid = { version = "1", features = ["v4"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
